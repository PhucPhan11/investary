name: investary

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (Phase 3 knowledge base). Same major version and volume as before,
    # so existing data is kept; see README "Upgrading to Phase 3" for the one-time REINDEX.
    image: pgvector/pgvector:0.8.7-pg17
    container_name: investary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investary}
      POSTGRES_USER: ${POSTGRES_USER:-investary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infrastructure/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
