# Production-safe defaults. Secrets come from the environment; nothing here is environment specific.
spring:
  application:
    name: investary
  datasource:
    url: ${INVESTARY_DB_URL:jdbc:postgresql://localhost:5432/investary}
    username: ${INVESTARY_DB_USERNAME:investary}
    password: ${INVESTARY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${INVESTARY_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${INVESTARY_MAX_REQUEST_SIZE:52MB}
  data:
    web:
      pageable:
        max-page-size: 100

server:
  tomcat:
    # Let Tomcat read oversized uploads fully so the client receives a clean 413 response.
    max-swallow-size: ${INVESTARY_MAX_REQUEST_SIZE:52MB}

investary:
  storage:
    root: ${INVESTARY_STORAGE_ROOT:${user.home}/.investary/documents}
  cors:
    allowed-origins: ${INVESTARY_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ${INVESTARY_LOG_FORMAT:ecs}
