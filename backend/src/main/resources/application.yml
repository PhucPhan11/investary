# Production-safe defaults. Secrets come from the environment; nothing here is environment specific.
spring:
  application:
    name: investary
  datasource:
    url: ${INVESTARY_DB_URL:jdbc:postgresql://localhost:5432/investary}
    username: ${INVESTARY_DB_USERNAME:investary}
    password: ${INVESTARY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${INVESTARY_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${INVESTARY_MAX_REQUEST_SIZE:52MB}
  data:
    web:
      pageable:
        max-page-size: 100
  # AI models (Phase 3). "none" disables a model; the application still starts and reports the missing capability.
  ai:
    model:
      embedding: ${INVESTARY_AI_EMBEDDING_PROVIDER:none}
      chat: ${INVESTARY_AI_CHAT_PROVIDER:none}
    retry:
      # Indexing jobs retry with their own backoff; keep provider-level retries short.
      max-attempts: 2
    ollama:
      base-url: ${INVESTARY_OLLAMA_BASE_URL:http://localhost:11434}
      timeout: ${INVESTARY_AI_TIMEOUT:120s}
      init:
        pull-model-strategy: never
      embedding:
        model: ${INVESTARY_EMBEDDING_MODEL:bge-m3}
        options:
          model: ${INVESTARY_EMBEDDING_MODEL:bge-m3}
      chat:
        model: ${INVESTARY_CHAT_MODEL:qwen3:8b}
        options:
          model: ${INVESTARY_CHAT_MODEL:qwen3:8b}
          temperature: 0.1
          num-ctx: 16384

server:
  tomcat:
    # Let Tomcat read oversized uploads fully so the client receives a clean 413 response.
    max-swallow-size: ${INVESTARY_MAX_REQUEST_SIZE:52MB}

investary:
  storage:
    root: ${INVESTARY_STORAGE_ROOT:${user.home}/.investary/documents}
  cors:
    allowed-origins: ${INVESTARY_CORS_ALLOWED_ORIGINS:}

  # Original EML files (source of truth for imported emails)
  email:
    storage:
      root: ${INVESTARY_EMAIL_STORAGE_ROOT:${user.home}/.investary/emails}
    max-size: ${INVESTARY_EMAIL_MAX_SIZE:25MB}

  # Known research providers. Domains identify the sender and form the download allowlist
  # (sub-domains included, e.g. tcbs.com.vn covers static.tcbs.com.vn).
  research:
    brokerages:
      - name: TCBS
        domains: [tcbs.com.vn]
      - name: SSI
        domains: [ssi.com.vn]
      - name: VNDIRECT
        domains: [vndirect.com.vn]
      - name: VCBS
        domains: [vcbs.com.vn]

  # Downloading research PDFs linked from emails. Defaults are deliberately strict.
  download:
    allow-http: false
    allow-private-networks: false
    allow-any-port: false
    additional-allowed-domains: ${INVESTARY_DOWNLOAD_EXTRA_DOMAINS:}
    connect-timeout: 10s
    read-timeout: 30s
    max-duration: 2m
    max-size: ${INVESTARY_DOWNLOAD_MAX_SIZE:50MB}
    max-redirects: 5
    temp-dir: ${INVESTARY_DOWNLOAD_TEMP_DIR:${user.home}/.investary/tmp}
    max-attempts: 3
    retry-backoff: 1m
    worker:
      enabled: ${INVESTARY_DOWNLOAD_WORKER_ENABLED:true}
      concurrency: 2
      poll-interval: 2s
      lease: 5m

  # Research knowledge base and assistant (Phase 3)
  knowledge:
    auto-index: ${INVESTARY_KNOWLEDGE_AUTO_INDEX:true}
    embedding:
      # Describes the vectors the configured model produces; part of the index version.
      provider: ${INVESTARY_AI_EMBEDDING_PROVIDER:none}
      model: ${INVESTARY_EMBEDDING_MODEL:bge-m3}
      dimensions: ${INVESTARY_EMBEDDING_DIMENSIONS:1024}
      batch-size: 16
      max-retries: 2
      retry-backoff: 2s
    chunking:
      target-tokens: 800
      max-tokens: 900
      overlap-tokens: 100
    email:
      bilingual-mode: PRIMARY_ONLY
    pdf:
      min-chars-per-page: 20
      max-empty-page-ratio: 0.8
    worker:
      enabled: ${INVESTARY_KNOWLEDGE_WORKER_ENABLED:true}
      concurrency: 1
      poll-interval: 3s
      reconcile-interval: 30s
      lease: 15m
      max-attempts: 3
      retry-backoff: 1m
    search:
      default-results: 8
      max-results: 20
      min-similarity: 0.35
      max-chunks-per-source: 3
    assistant:
      model-label: ${INVESTARY_AI_CHAT_PROVIDER:none}:${INVESTARY_CHAT_MODEL:qwen3:8b}
      max-context-chars: 12000
      timeout: ${INVESTARY_AI_TIMEOUT:120s}

  # Portfolios (Phase 4). Prices are manual observations; older ones mark the valuation STALE.
  portfolio:
    price-stale-after-days: ${INVESTARY_PRICE_STALE_AFTER_DAYS:7}

  # Portfolio-aware intelligence (Phase 4). Reuses the knowledge-base search and assistant settings.
  intelligence:
    research-fresh-days: ${INVESTARY_RESEARCH_FRESH_DAYS:90}
    concentration-threshold-pct: ${INVESTARY_CONCENTRATION_THRESHOLD_PCT:30}
    max-holdings-in-context: 10
    evidence-per-holding: 3
    market-context-results: 3

  # Gmail integration (Phase 5 / Milestone 1). Credentials come only from the environment (infrastructure/.env
  # in dev). Without them the integration reports "not configured" and the rest of the app works as before.
  gmail:
    client-id: ${INVESTARY_GMAIL_CLIENT_ID:}
    client-secret: ${INVESTARY_GMAIL_CLIENT_SECRET:}
    token-key: ${INVESTARY_GMAIL_TOKEN_KEY:}
    redirect-uri: ${INVESTARY_GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/integrations/gmail/callback}
    ui-redirect-url: ${INVESTARY_GMAIL_UI_REDIRECT_URL:http://localhost:4200/automation}
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    revoke-uri: https://oauth2.googleapis.com/revoke
    api-base-url: https://gmail.googleapis.com
    connect-timeout: 10s
    read-timeout: 60s
    max-retries: 4
    retry-backoff: 1s
    max-retry-wait: 30s
    state-ttl: 10m
    sync:
      scheduler-enabled: ${INVESTARY_GMAIL_SYNC_SCHEDULER_ENABLED:true}
      interval: ${INVESTARY_GMAIL_SYNC_INTERVAL:30m}
      initial-delay: 2m
      initial-lookback-days: ${INVESTARY_GMAIL_INITIAL_LOOKBACK_DAYS:30}
      max-messages-per-run: ${INVESTARY_GMAIL_MAX_MESSAGES_PER_RUN:200}
      recovery-max-lookback-days: ${INVESTARY_GMAIL_RECOVERY_MAX_LOOKBACK_DAYS:30}
      lock-lease: 10m
      page-size: 100

  # Automated research processing (Phase 5 / Milestone 2): email/document workflow from import to impact
  # assessment. Sources imported before the feature was installed are only processed on request.
  workflow:
    enabled: ${INVESTARY_WORKFLOW_ENABLED:true}
    max-attempts: ${INVESTARY_WORKFLOW_MAX_ATTEMPTS:3}
    retry-backoff: ${INVESTARY_WORKFLOW_RETRY_BACKOFF:1m}
    wait-poll: 15s
    download-wait-timeout: 2h
    index-wait-timeout: 6h
    max-downloads-per-email: ${INVESTARY_WORKFLOW_MAX_DOWNLOADS_PER_EMAIL:5}
    max-downloads-per-sync-run: ${INVESTARY_WORKFLOW_MAX_DOWNLOADS_PER_SYNC_RUN:20}
    auto-assess: ${INVESTARY_WORKFLOW_AUTO_ASSESS:true}
    max-auto-assessments-per-day: ${INVESTARY_WORKFLOW_MAX_AUTO_ASSESSMENTS_PER_DAY:20}
    assess-market-context: ${INVESTARY_WORKFLOW_ASSESS_MARKET_CONTEXT:false}
    worker:
      enabled: ${INVESTARY_WORKFLOW_WORKER_ENABLED:true}
      concurrency: ${INVESTARY_WORKFLOW_CONCURRENCY:2}
      poll-interval: 2s
      lease: 15m
      reconcile-interval: 1m

  # Process-wide limits on concurrent AI provider calls (assistant, intelligence, indexing, workflows).
  ai:
    max-concurrent-chat: ${INVESTARY_AI_MAX_CONCURRENT_CHAT:2}
    max-concurrent-embedding: ${INVESTARY_AI_MAX_CONCURRENT_EMBEDDING:1}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ${INVESTARY_LOG_FORMAT:ecs}
