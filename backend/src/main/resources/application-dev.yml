# Local development profile (activated automatically by `./mvnw spring-boot:run`).
# Reads POSTGRES_* from infrastructure/.env so the database password is defined in exactly one place.
spring:
  config:
    import: optional:file:../infrastructure/.env[.properties]
  datasource:
    url: ${INVESTARY_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:investary}}
    username: ${INVESTARY_DB_USERNAME:${POSTGRES_USER:investary}}
    password: ${INVESTARY_DB_PASSWORD:${POSTGRES_PASSWORD}}

investary:
  cors:
    allowed-origins: ${INVESTARY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  # Keep local data inside the project, in the git-ignored data/ folder. user.dir is backend/, the working directory
  # of spring-boot:run (the .env import above relies on it too). A bare "../" is rejected by Spring's Path binding.
  # Never commit data/ (ADR 0015).
  storage:
    root: ${INVESTARY_STORAGE_ROOT:${user.dir}/../data/documents}
  email:
    storage:
      root: ${INVESTARY_EMAIL_STORAGE_ROOT:${user.dir}/../data/emails}
  download:
    temp-dir: ${INVESTARY_DOWNLOAD_TEMP_DIR:${user.dir}/../data/tmp}

logging:
  structured:
    format:
      console: ${INVESTARY_LOG_FORMAT:}
  level:
    com.investary: DEBUG
