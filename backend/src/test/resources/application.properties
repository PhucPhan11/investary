# Test-only overrides: keep all files in the temp directory, run background workers only where a test enables them,
# and never call a real AI provider (tests supply fake models).
investary.storage.root=${java.io.tmpdir}/investary-test/documents
investary.email.storage.root=${java.io.tmpdir}/investary-test/emails
investary.download.temp-dir=${java.io.tmpdir}/investary-test/downloads
investary.download.worker.enabled=false
logging.structured.format.console=
investary.knowledge.worker.enabled=false
spring.ai.model.embedding=none
spring.ai.model.chat=none
